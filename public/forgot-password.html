<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>Forgot Password | Growble</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: linear-gradient(135deg,#0b1220,#231942);
      color: #fff;
    }
    .card {
      width: min(420px, 100%);
      padding: 26px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      background: rgba(255,255,255,.06);
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }
    .brand { color: #00d4ff; font-size: 26px; font-weight: 800; }
    h1 { margin: 14px 0 8px; font-size: 22px; }
    p { color: #d3deeb; font-size: 14px; line-height: 1.5; }
    label { display: block; margin: 18px 0 6px; font-size: 13px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 12px;
      background: rgba(0,0,0,.2);
      color: #fff;
      font-size: 14px;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: #00d4ff;
      color: #06131b;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { cursor: wait; opacity: .65; }
    .status { min-height: 20px; margin: 12px 0 0; }
    .status.error { color: #ffaaaa; }
    .status.success { color: #9af0c1; }
    .bottom { margin-top: 18px; text-align: center; }
    a { color: #00d4ff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Growble</div>
    <h1>Forgot your password?</h1>
    <p>Enter the email address on your account. If it exists, we’ll email you a secure password reset link.</p>
    <form id="forgotForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required/>
      <button id="submitBtn" type="submit">Send reset link</button>
    </form>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div class="bottom"><a href="/login.html">Back to login</a></div>
  </main>
  <script>
    const form = document.getElementById("forgotForm");
    const submitButton = document.getElementById("submitBtn");
    const statusBox = document.getElementById("status");

    form.addEventListener("submit", async event => {
      event.preventDefault();
      statusBox.textContent = "";
      statusBox.className = "status";
      submitButton.disabled = true;
      submitButton.textContent = "Sending…";

      try {
        const response = await fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: document.getElementById("email").value.trim() })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || "Could not send the reset link.");

        statusBox.textContent = data.message;
        statusBox.classList.add("success");
      } catch (error) {
        statusBox.textContent = error.message || "Could not send the reset link. Please try again.";
        statusBox.classList.add("error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Send reset link";
      }
    });
  </script>
</body>
</html>
