<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>Choose a New Password | Growble</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: linear-gradient(135deg,#0b1220,#231942);
      color: #fff;
    }
    .card {
      width: min(420px, 100%);
      padding: 26px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      background: rgba(255,255,255,.06);
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }
    .brand { color: #00d4ff; font-size: 26px; font-weight: 800; }
    h1 { margin: 14px 0 8px; font-size: 22px; }
    p { color: #d3deeb; font-size: 14px; line-height: 1.5; }
    label { display: block; margin: 18px 0 6px; font-size: 13px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 12px;
      background: rgba(0,0,0,.2);
      color: #fff;
      font-size: 14px;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: #00d4ff;
      color: #06131b;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { cursor: wait; opacity: .65; }
    .status { min-height: 20px; margin: 12px 0 0; }
    .status.error { color: #ffaaaa; }
    .status.success { color: #9af0c1; }
    .bottom { margin-top: 18px; text-align: center; }
    a { color: #00d4ff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Growble</div>
    <h1>Choose a new password</h1>
    <p>Use at least 8 characters. Your reset link can only be used once and expires after one hour.</p>
    <form id="resetForm">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required/>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required/>
      <button id="submitBtn" type="submit">Update password</button>
    </form>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div class="bottom"><a href="/login.html">Back to login</a></div>
  </main>
  <script>
    const form = document.getElementById("resetForm");
    const submitButton = document.getElementById("submitBtn");
    const statusBox = document.getElementById("status");
    const token = new URLSearchParams(window.location.search).get("token") || "";

    if (!/^[a-f0-9]{64}$/i.test(token)) {
      form.hidden = true;
      statusBox.textContent = "This password reset link is invalid or has expired.";
      statusBox.classList.add("error");
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      statusBox.textContent = "";
      statusBox.className = "status";

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      if (password !== confirmPassword) {
        statusBox.textContent = "The passwords do not match.";
        statusBox.classList.add("error");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Updating…";
      try {
        const response = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || "Could not update your password.");

        form.hidden = true;
        statusBox.textContent = data.message;
        statusBox.classList.add("success");
      } catch (error) {
        statusBox.textContent = error.message || "Could not update your password. Please try again.";
        statusBox.classList.add("error");
        submitButton.disabled = false;
        submitButton.textContent = "Update password";
      }
    });
  </script>
</body>
</html>
