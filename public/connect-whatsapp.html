<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" href="/images/fevicon.png">
<meta charset="UTF-8">
<title>Connect WhatsApp</title>

<style>

body{
background:#0b1220;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
color:white;
}

.card{

background:#151d31;

padding:40px;

border-radius:15px;

width:450px;

text-align:center;

}
.brand{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin-bottom:14px;
color:#00d4ff;
font-size:24px;
font-weight:900;
}
.brand img{height:42px;width:42px;object-fit:contain}

button{

width:100%;

padding:15px;

background:#25D366;

color:white;

font-size:18px;

border:none;

border-radius:10px;

cursor:pointer;

}

button:hover{

opacity:.9;

}

</style>

</head>

<body>

<div class="card">

<div class="brand">
<img src="/images/logo.png" alt="" aria-hidden="true"/>
<span>Growble</span>
</div>

<h2>Connect Your WhatsApp Business</h2>

<p>

Connect your WhatsApp Business Account securely using Meta.

</p>

<br>

<button id="connectBtn">

Connect with Facebook

</button>

</div>

<script src="/connect-whatsapp.js"></script>
<div id="fb-root"></div>

<script>
  window.fbAsyncInit = function() {
    FB.init({
      appId            : '2353053915180115',
      autoLogAppEvents : true,
      xfbml            : true,
      version          : 'v26.0'
    });
  };
</script>
<script async defer crossorigin="anonymous"
  src="https://connect.facebook.net/en_US/sdk.js">
</script>

</body>

</html>
