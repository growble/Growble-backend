<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Team Workspace - Growble</title>
  <style>
    *{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
    body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(circle at top,#0a2a43,#0b1220 55%);color:#fff}
    main{max-width:820px;margin:auto}
    .card{padding:22px;margin:18px 0;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
    h1,h2{margin-top:0}
    .muted{opacity:.75;font-size:14px}
    .row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1)}
    .row:last-child{border-bottom:0}
    input{padding:11px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:#0b1524;color:#fff;flex:1;min-width:0}
    button,.button{padding:10px 14px;border:0;border-radius:9px;background:#00d4ff;color:#03131c;font-weight:700;cursor:pointer;text-decoration:none}
    button.danger{background:rgba(255,90,90,.18);border:1px solid rgba(255,90,90,.4);color:#ffd0d0}
    form{display:flex;gap:10px;margin-top:12px}
    #status{min-height:20px;margin-top:10px;color:#8cecff}
    @media(max-width:540px){form{flex-direction:column}.row{align-items:flex-start}}
  </style>
</head>
<body>
  <main>
    <p><a class="button" href="/index.html">← Dashboard</a></p>
    <h1>Team workspace</h1>
    <p class="muted" id="seatSummary">Loading workspace…</p>
    <section class="card">
      <h2>Members</h2>
      <div id="members">Loading…</div>
      <div id="inviteArea" hidden>
        <h2 style="margin-top:24px">Invite a teammate</h2>
        <p class="muted">The owner counts as one seat. Invitations expire after 7 days.</p>
        <form id="inviteForm">
          <input id="inviteEmail" type="email" placeholder="teammate@example.com" required/>
          <button type="submit">Send invitation</button>
        </form>
        <div id="invitations"></div>
      </div>
      <div id="status" role="status"></div>
    </section>
  </main>
  <script src="/team.js"></script>
</body>
</html>
